<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视光管理系统 - 会员 / 病例 / 验光单</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">视光管理系统</h1>
      <div class="header-actions">
        <span id="storeLabel" class="store-label"></span>
        <button id="syncBtn" class="btn btn-ghost" title="数据同步">同步</button>
        <button id="homeBtn" class="btn btn-ghost" title="返回首页">首页</button>
      </div>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <!-- Modal container -->
  <div id="modalRoot" class="modal-root hidden"></div>
  <!-- Toast container -->
  <div id="toastRoot" class="toast-root"></div>

  <!-- Hidden file input for import -->
  <input type="file" id="syncFileInput" accept="application/json" style="display:none">

  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/member.js"></script>
  <script src="js/case.js"></script>
  <script src="js/optometry.js"></script>
  <script src="js/points.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
